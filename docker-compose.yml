services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novawallet
      POSTGRES_USER: novawallet
      POSTGRES_PASSWORD: novawallet_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novawallet -d novawallet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=novawallet;Username=novawallet;Password=novawallet_secret"
      Jwt__SigningKey: "novawallet-docker-signing-key-change-in-production-min-32-chars"
      Jwt__Issuer: "novawallet-mock"
      Jwt__Audience: "novawallet-api"
      Jwt__ExpiryMinutes: "60"
      Wallet__DailyOutboundLimitKobo: "50000000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
